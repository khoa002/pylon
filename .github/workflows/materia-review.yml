# Materia caller workflow.
#
# Adapted from khoa002/materia examples/caller-workflow.yml. The upstream example
# uses `khoa002/materia@v1` directly; that cannot work here. Pylon is public and
# Materia is private, and GitHub will not resolve a private action from a public
# repo even with the Access setting enabled:
#
#   ##[error]Unable to resolve action `khoa002/materia`, not found
#
# So Materia is checked out with a read token and invoked from a local path.
#
# Note: the FIRST pull request that adds this file is not reviewed. The action
# validates that this workflow matches the copy on the default branch, so review
# begins once this file is merged to main. See materia docs/adoption.md.

name: Materia Review

# pull_request, never pull_request_target. Fork PRs get no secrets, which is
# intentional. See materia docs/security.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege. Three lines, each explained. Do not use write-all.
permissions:
  contents: read # read the code under review
  pull-requests: write # post review comments
  id-token: write # exchange the OIDC token for a GitHub App token

# One review per PR at a time. A new push cancels an in-flight run, which cuts
# duplicate reviews and comment noise. It does not refund a run already started.
concurrency:
  group: materia-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Fork PRs receive no secrets, so the Materia checkout below cannot authenticate
    # and the job would fail red on every outside contribution. Skipping is the
    # honest outcome: no review, no false alarm.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required: Materia needs history to diff against the base

      # Materia is private, so it is cloned rather than resolved as an action.
      # persist-credentials: false keeps the read token out of the checked-out
      # .git/config once the clone finishes.
      - name: Check out Materia
        uses: actions/checkout@v7
        with:
          repository: khoa002/materia
          ref: v1
          token: ${{ secrets.MATERIA_READ_TOKEN }}
          path: .materia-action
          persist-credentials: false

      - uses: ./.materia-action
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
